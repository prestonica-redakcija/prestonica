name: Primena izmena

on:
  push:
    paths:
      - .github/workflows/primeni.yml

permissions:
  contents: write

jobs:
  primeni:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Statistika citanosti
        run: |
          git config user.name "prestonica-bot"
          git config user.email "bot@users.noreply.github.com"
          python3 - <<'PY'
          import pathlib
          p = pathlib.Path("templates/base.html")
          t = p.read_text(encoding="utf-8")
          old = "<script>{{ js|safe }}</script>\n</body>"
          assert old in t and "/api/stat" not in t
          TRK = r"""{% if domain %}<script>(function(){try{if(!/(^|\.)prestonica\.rs$/.test(location.hostname)||navigator.webdriver)return;try{if(localStorage.getItem("prestonica_ne_broji")==="1")return}catch(e){}
          var A="/api/stat",id=(Date.now().toString(36)+Math.random().toString(36).slice(2,12)).slice(0,20),q=new URLSearchParams(location.search),m=document.querySelector('meta[property="article:section"]');
          function s(p,o){var b=JSON.stringify(o);try{if(navigator.sendBeacon&&navigator.sendBeacon(A+p,new Blob([b],{type:"text/plain"})))return}catch(e){}fetch(A+p,{method:"POST",body:b,keepalive:true,headers:{"Content-Type":"text/plain"}}).catch(function(){})}
          s("/v",{id:id,p:location.pathname,r:document.referrer,n:document.title,s:m?m.content:"",w:screen.width,u:q.get("utm_source")||""});
          var act=0,last=Date.now(),vis=!document.hidden,dub=0;function tick(){var n=Date.now();if(vis)act+=Math.min(n-last,60000);last=n}
          function sc(){var h=document.documentElement,H=Math.max(h.scrollHeight,document.body.scrollHeight),p=H?Math.round(100*((window.scrollY||h.scrollTop)+innerHeight)/H):100;if(p>dub)dub=Math.min(100,p)}
          addEventListener("scroll",sc,{passive:true});setTimeout(sc,800);setInterval(tick,10000);
          function end(){tick();if(act>=1000)s("/x",{id:id,sek:Math.round(act/1000),dub:dub})}
          document.addEventListener("visibilitychange",function(){tick();vis=!document.hidden;last=Date.now();if(document.hidden)end()});addEventListener("pagehide",end)}catch(e){}})();</script>{% endif %}
          """
          p.write_text(t.replace(old, TRK + old), encoding="utf-8")
          b = pathlib.Path("engine/build.py")
          s = b.read_text(encoding="utf-8")
          o = 'User-agent: *\\nAllow: /\\nSitemap:'
          assert o in s
          s = s.replace(o, 'User-agent: *\\nAllow: /\\nDisallow: /statistika.html\\nSitemap:')
          o2 = '{base}news-sitemap.xml\\n")\n'
          assert s.count(o2) == 1
          s = s.replace(o2, o2 + '    stat = Path(__file__).resolve().parent.parent / "static" / "statistika.html"\n    if stat.exists():\n        (out / "statistika.html").write_text(stat.read_text(encoding="utf-8"), encoding="utf-8")\n')
          b.write_text(s, encoding="utf-8")
          print("UREDJENO")
          PY
          git rm -q .github/workflows/primeni.yml
          git add -A engine templates
          git commit -q -m "Statistika citanosti portala"
          for i in 1 2 3 4 5 6; do
            git pull --rebase -q origin main && git push -q origin HEAD:main && echo "PRIMENJENO" && exit 0
            sleep 10
          done
          exit 1
