            "U utorak, 17. novembra, na Međunarodni dan studenata, u Dom Narodne skupštine ulazi 140 poslanika liste koja je nastala na ulici, a ne u stranačkim prostorijama. Na galeriji će, ako se usvoji njihov zahtev, sedeti studentska delegacija. Slika će biti lepa. Ali od utorka slike više nisu dovoljne, jer počinju odluke.",
            "Prvo pitanje: ko odlučuje? „Lista nema lidera“, poručili su osnivači u septembru. Na mitingu je to zvučalo kao obećanje da niko neće biti iznad ljudi. U Skupštini, gde se usvaja budžet, biraju sudije i ratifikuju međunarodni ugovori, to zvuči drugačije. Dejan Šoškić, bivši guverner Narodne banke i poslanik liste, rekao je u „Utisku nedelje“ da grupa poslanika „po slovu zakona postaje vlasnik mandata i samostalno odlučuje“. To je pravi odgovor. Ali Kurir u isto vreme, pozivajući se na nezvanične informacije, piše da je kandidatkinja za predsednicu Skupštine izabrana na plenumu. Ako je tako, građani imaju pravo da znaju ko je glasao, koliko ih je bilo i kome taj plenum odgovara.",
