name: Primena izmena

on:
  push:
    paths:
      - .github/workflows/primeni.yml

permissions:
  contents: write

jobs:
  primeni:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Bocna polja prate promenu visine
        run: |
          git config user.name "prestonica-bot"
          git config user.email "bot@users.noreply.github.com"
          python3 - <<'PY'
          import pathlib
          a = pathlib.Path("static/app.js")
          s = a.read_text(encoding="utf-8")
          o = "  place(); setTimeout(place, 700);\n})();"
          assert s.count(o) == 1 and "ResizeObserver(req)" not in s
          s = s.replace(o, "  if (window.ResizeObserver) { var ro = new ResizeObserver(req); for (var n = 0; n < sides.length; n++) ro.observe(sides[n]); }\n" + o)
          a.write_text(s, encoding="utf-8")
          print("PRATI VISINU")
          PY
          git rm -q .github/workflows/primeni.yml
          git add -A static
          git commit -q -m "Bocna polja se ponovo postavljaju kad se ucitaju prognoza i kurs"
          for i in 1 2 3 4 5 6; do
            git pull --rebase -q origin main && git push -q origin HEAD:main && echo "PRIMENJENO" && exit 0
            sleep 10
          done
          exit 1
