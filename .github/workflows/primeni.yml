name: Primena izmena

on:
  push:
    paths:
      - .github/workflows/primeni.yml

permissions:
  contents: write

jobs:
  primeni:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Usi i bocna polja blize sadrzaju
        run: |
          git config user.name "prestonica-bot"
          git config user.email "bot@users.noreply.github.com"
          python3 - <<'PY'
          import pathlib
          a = pathlib.Path("static/app.js")
          s = a.read_text(encoding="utf-8")
          o1 = '    de.style.setProperty("--es", Math.max(0.72, Math.min(1.3, gw / 300)).toFixed(3));\n'
          n1 = ('    var er = m.querySelector(".m-ear-r"), ew = (er && er.offsetWidth) || 260, es = Math.min(1.3, (gw - 72) / ew);\n'
                '    de.style.setProperty("--es", Math.max(es, 0.5).toFixed(3));\n'
                '    m.classList.toggle("ear-off", es < 0.5);\n')
          o2 = '      s.style.top = Math.round(mb + Math.max(18, (vh - mb - h * sc) / 2) + (i ? px * 0.5 : px)) + "px";\n'
          n2 = o2 + '      var cx = gw + 16 - 40 - 160 * sc;\n      s.style.left = Math.round(i ? de.clientWidth - cx : cx) + "px";\n'
          assert s.count(o1) == 1 and s.count(o2) == 1
          s = s.replace(o1, n1).replace(o2, n2)
          a.write_text(s, encoding="utf-8")
          CSS = r'''/* sirok ekran: usi i bocna polja uz sam sadrzaj, simetricno (oko 40 px od ivice sadrzaja) */
          @media (min-width:1680px) and (hover:hover) and (pointer:fine){
          .m-ear-l{left:auto;right:calc(50% + 648px);transform:scale(var(--es,1));transform-origin:100% 50%}
          .m-ear-r{right:auto;left:calc(50% + 648px);transform:scale(var(--es,1));transform-origin:0 50%}
          .mast.ear-off .m-ear{visibility:hidden}
          }
          '''
          c = pathlib.Path("static/style.css")
          t = c.read_text(encoding="utf-8")
          assert "ear-off" not in t
          c.write_text(t.rstrip("\n") + "\n" + CSS, encoding="utf-8")
          print("BLIZE SADRZAJU")
          PY
          git rm -q .github/workflows/primeni.yml
          git add -A static
          git commit -q -m "Usi zaglavlja i bocna polja blize sadrzaju, simetricno"
          for i in 1 2 3 4 5 6; do
            git pull --rebase -q origin main && git push -q origin HEAD:main && echo "PRIMENJENO" && exit 0
            sleep 10
          done
          exit 1
