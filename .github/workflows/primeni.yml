name: Primena izmena

on:
  push:
    paths:
      - .github/workflows/primeni.yml

permissions:
  contents: write

jobs:
  primeni:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Azuriranje analize
