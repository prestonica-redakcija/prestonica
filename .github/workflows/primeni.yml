name: Primena izmena

on:
  push:
    paths:
      - .github/workflows/primeni.yml

permissions:
  contents: write

jobs:
  primeni:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Mapa Srbije u bocnim poljima
        run: |
          git config user.name "prestonica-bot"
          git config user.email "bot@users.noreply.github.com"
          mkdir -p /tmp/geo && cd /tmp/geo
          npm init -y >/dev/null
          npm i -s world-atlas@2.0.2 topojson-client@3.1.0 d3-geo@3.1.1
          cat > mapa.mjs <<'JS'
          import fs from 'fs';
          import {merge} from 'topojson-client';
          import {geoMercator} from 'd3-geo';
          const topo = JSON.parse(fs.readFileSync('node_modules/world-atlas/countries-10m.json'));
          const pick = topo.objects.countries.geometries.filter(x => ['Serbia', 'Kosovo'].includes(x.properties.name));
          const f = {type: 'Feature', geometry: merge(topo, pick)};
          const proj = geoMercator().fitSize([680, 860], f);
          const G = f.geometry;
          const polys = G.type === 'Polygon' ? [G.coordinates] : G.coordinates;
          const rings = polys.map(p => p[0]).map(r => r.map(c => proj(c)));
          function dp(pts, eps) {
            if (pts.length < 3) return pts;
            let dmax = 0, idx = 0;
            const a = pts[0], b = pts[pts.length - 1];
            for (let i = 1; i < pts.length - 1; i++) {
              const p = pts[i];
              const num = Math.abs((b[1] - a[1]) * p[0] - (b[0] - a[0]) * p[1] + b[0] * a[1] - b[1] * a[0]);
              const den = Math.hypot(b[1] - a[1], b[0] - a[0]) || 1;
              const d = num / den;
              if (d > dmax) { dmax = d; idx = i; }
            }
            return dmax > eps ? [...dp(pts.slice(0, idx + 1), eps).slice(0, -1), ...dp(pts.slice(idx), eps)] : [a, b];
          }
          const d = rings.map(r => { const h = r.length >> 1; const s = [...dp(r.slice(0, h + 1), 1).slice(0, -1), ...dp(r.slice(h), 1)]; return 'M' + s.map(p => p.map(n => Math.round(n)).join(' ')).join('L') + 'Z'; }).join('');
          fs.writeFileSync(process.argv[2], d);
          JS
          node mapa.mjs /tmp/mapa.txt
          cd "$GITHUB_WORKSPACE"
          python3 - <<'PY'
          import pathlib
          P = pathlib.Path("/tmp/mapa.txt").read_text().strip()
          assert P.startswith("M") and len(P) > 1500
          GRADOVI = [("Subotica", 162, 15, "r"), ("Sombor", 83, 82, "r"), ("Novi Sad", 186, 186, "l"), ("Zrenjanin", 262, 162, "r"),
                     ("Šabac", 165, 290, "l"), ("Valjevo", 195, 385, "l"), ("Kragujevac", 340, 437, "r"), ("Čačak", 259, 461, "l"),
                     ("Užice", 188, 468, ""), ("Kraljevo", 308, 494, ""), ("Zaječar", 536, 459, "r"), ("Niš", 480, 574, "r"),
                     ("Novi Pazar", 283, 610, "l"), ("Leskovac", 487, 637, "r"), ("Priština", 376, 702, "l"), ("Vranje", 481, 724, "r")]
          UDALJENOSTI = [("Pančevo", 16), ("Smederevo", 41), ("Šabac", 61), ("Zrenjanin", 63), ("Novi Sad", 70), ("Valjevo", 75),
                         ("Kragujevac", 96), ("Čačak", 103), ("Užice", 117), ("Kraljevo", 123), ("Sombor", 150), ("Subotica", 155)]
          g = ""
          for n, x, y, s in GRADOVI:
              g += f'<circle cx="{x}" cy="{y}" r="6"/>'
              if s == "r":
                  g += f'<text x="{x + 16}" y="{y + 10}">{n}</text>'
              elif s == "l":
                  g += f'<text x="{x - 16}" y="{y + 10}" text-anchor="end">{n}</text>'
          lis = "".join(f"<li><span>{n}</span><i></i><b>{d} km</b></li>" for n, d in UDALJENOSTI)
          HTML = ('<div class="gutters" aria-hidden="true"><div class="g-side g-l"><svg class="g-map" viewBox="-40 -14 760 888">'
                  f'<defs><path id="g-srb" d="{P}"/><clipPath id="g-clip"><use href="#g-srb"/></clipPath>'
                  '<pattern id="g-dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="11" cy="11" r="3.6"/></pattern></defs>'
                  '<use class="g-base" href="#g-srb"/><rect class="g-fill" x="0" y="0" width="680" height="860" fill="url(#g-dots)" clip-path="url(#g-clip)"/>'
                  '<use class="g-out" href="#g-srb"/>'
                  f'<g class="g-c">{g}</g>'
                  '<g class="g-bg"><circle class="g-ring" cx="275" cy="276" r="22"/><circle class="g-ring g-ring2" cx="275" cy="276" r="22"/>'
                  '<circle class="g-core" cx="275" cy="276" r="8"/><text x="300" y="268">BEOGRAD</text></g></svg>'
                  '<p class="g-cap"><b>Srbija</b> u jednom pogledu</p></div>'
                  '<div class="g-side g-r"><div class="g-radar"><span></span><span></span><span></span><i></i></div>'
                  '<p class="g-coord">44°49′ N &nbsp;·&nbsp; 20°27′ E</p><p class="g-h">Od prestonice</p>'
                  f'<ol class="g-list">{lis}</ol><p class="g-note">Vazdušnom linijom</p></div></div>\n')
          CSS = """
          /* sirok ekran: mapa Srbije i udaljenosti od prestonice u praznim bocnim poljima */
          .gutters{display:none}
          @media (min-width:1680px) and (hover:hover) and (pointer:fine){
          .gutters{display:block;position:fixed;inset:0;z-index:-1;pointer-events:none;--gw:calc((100vw - 1240px) / 2);--px:0px}
          .g-side{position:absolute;top:calc(50% + 70px);width:min(calc(var(--gw) - 64px),360px);transform:translate(-50%,-50%) translateY(var(--px));will-change:transform;opacity:0;animation:g-in 1.2s .3s var(--ease,ease) forwards}
          .g-l{left:calc(var(--gw) / 2)}
          .g-r{left:calc(100vw - var(--gw) / 2);transform:translate(-50%,-50%) translateY(calc(var(--px) * -1))}
          @keyframes g-in{to{opacity:1}}
          .g-map{width:100%;height:auto;display:block;overflow:visible}
          .g-base{fill:var(--ink);opacity:.045}
          .g-fill{opacity:.34}
          .g-map pattern circle{fill:var(--ink)}
          .g-out{fill:none;stroke:var(--ink);stroke-width:2.4;opacity:.28}
          .g-c circle{fill:var(--surface);stroke:var(--ink-3);stroke-width:2;opacity:.9}
          .g-c text,.g-bg text{font:600 31px var(--sans);fill:var(--ink-3);letter-spacing:.02em}
          .g-bg text{font-weight:800;font-size:32px;letter-spacing:.14em;fill:var(--ink)}
          .g-core{fill:var(--brand)}
          .g-ring{fill:none;stroke:var(--brand);stroke-width:2;transform-box:fill-box;transform-origin:center;animation:g-pulse 3.2s ease-out infinite}
          .g-ring2{animation-delay:1.6s}
          @keyframes g-pulse{0%{transform:scale(.4);opacity:.9}100%{transform:scale(2.6);opacity:0}}
          .g-cap{margin:18px 0 0;text-align:center;font:italic 15px var(--display,Georgia,serif);color:var(--ink-3)}
          .g-cap b{font:800 11px var(--sans);letter-spacing:.2em;text-transform:uppercase;color:var(--ink-2);margin-right:6px;font-style:normal}
          .g-radar{position:relative;width:116px;height:116px;margin:0 auto 16px}
          .g-radar span{position:absolute;inset:0;border:1px solid var(--ink);border-radius:50%;opacity:.14}
          .g-radar span:nth-child(2){inset:19px;opacity:.2}
          .g-radar span:nth-child(3){inset:38px;opacity:.28}
          .g-radar i{position:absolute;left:50%;top:50%;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;background:var(--brand);box-shadow:0 0 0 6px color-mix(in srgb,var(--brand) 18%,transparent)}
          .g-radar::before{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,color-mix(in srgb,var(--brand) 22%,transparent),transparent 28%);animation:g-spin 7s linear infinite;opacity:.7}
          @keyframes g-spin{to{transform:rotate(360deg)}}
          .g-coord{margin:0 0 20px;text-align:center;font:700 11.5px var(--sans);letter-spacing:.16em;color:var(--ink-3);font-variant-numeric:tabular-nums}
          .g-h{margin:0 0 10px;font:800 11px var(--sans);letter-spacing:.2em;text-transform:uppercase;color:var(--ink-2);display:flex;align-items:center;gap:10px}
          .g-h::after{content:"";flex:1;height:2px;background:linear-gradient(90deg,var(--ink) 0 84%,var(--brand) 84%);opacity:.5}
          .g-list{list-style:none;margin:0;padding:0;display:grid;gap:7px}
          .g-list li{display:flex;align-items:baseline;gap:8px;font:600 13px var(--sans);color:var(--ink-3)}
          .g-list i{flex:1;border-bottom:1px dotted var(--ink-3);opacity:.45;transform:translateY(-3px)}
          .g-list b{font-weight:800;color:var(--ink-2);font-variant-numeric:tabular-nums}
          .g-list li:first-child b{color:var(--brand)}
          .g-note{margin:12px 0 0;font:italic 12.5px var(--display,Georgia,serif);color:var(--ink-3);text-align:right}
          @media (max-height:860px){.g-list li:nth-child(n+9){display:none}}
          @media (prefers-reduced-motion:reduce){.g-ring,.g-radar::before{animation:none}.g-side{animation:none;opacity:1}}
          }
          @media print{.gutters{display:none!important}}
          """
          b = pathlib.Path("templates/base.html")
          t = b.read_text(encoding="utf-8")
          body = "<body class=\"page-{{ active or 'strana' }}\">\n"
          assert t.count(body) == 1 and "gutters" not in t
          b.write_text(t.replace(body, body + HTML), encoding="utf-8")
          c = pathlib.Path("static/style.css")
          s = c.read_text(encoding="utf-8")
          assert ".gutters" not in s
          c.write_text(s.rstrip("\n") + "\n" + CSS, encoding="utf-8")
          a = pathlib.Path("static/app.js")
          j = a.read_text(encoding="utf-8")
          o1 = 'var mast = $("#mast"), tb = document.querySelector(".topbar"),'
          assert j.count(o1) == 1
          j = j.replace(o1, 'var gut = document.querySelector(".gutters"), wide = window.matchMedia ? window.matchMedia("(min-width: 1680px)") : null, mast = $("#mast"), tb = document.querySelector(".topbar"),')
          o2 = "  function onScroll() {\n    if (mast) {"
          assert j.count(o2) == 1
          j = j.replace(o2, "  function onScroll() {\n    if (gut && wide && wide.matches) gut.style.setProperty(\"--px\", Math.max(-40, Math.min(40, -window.scrollY * 0.03)).toFixed(1) + \"px\");\n    if (mast) {")
          a.write_text(j, encoding="utf-8")
          print("MAPA UGRADJENA")
          PY
          git rm -q .github/workflows/primeni.yml
          git add -A static templates
          git commit -q -m "Mapa Srbije i udaljenosti od prestonice u bocnim poljima sirokog ekrana"
          for i in 1 2 3 4 5 6; do
            git pull --rebase -q origin main && git push -q origin HEAD:main && echo "PRIMENJENO" && exit 0
            sleep 10
          done
          exit 1
