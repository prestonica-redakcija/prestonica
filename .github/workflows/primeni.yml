name: Primena izmena

on:
  push:
    paths:
      - .github/workflows/primeni.yml

permissions:
  contents: write

jobs:
  primeni:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Rubrika Anonimno
        run: |
          git config user.name "prestonica-bot"
          git config user.email "bot@users.noreply.github.com"
          cat > engine/anonimno.py <<'F1'
          """Rubrika Anonimno: dojave i informacije iz nezvaničnih izvora koje redakcija ručno odabere.

          Svaka stavka je JSON fajl u data/anonimno/. Na sajtu svaka stavka uvek nosi oznaku
          "Neprovereno", stranica nije u pretraživačima, RSS-u ni u objavama na mrežama.
          """
          from __future__ import annotations

          import hashlib
          import json
          import re
          from datetime import datetime
          from pathlib import Path
          from urllib.parse import urlparse
          from zoneinfo import ZoneInfo

          from . import pravila
          from .config import ROOT
          from .util import fold, now_utc

          DIR = ROOT / "data" / "anonimno"
          _URL = re.compile(r"https?://\S+")
          _MES = ["jan", "feb", "mar", "apr", "maj", "jun", "jul", "avg", "sep", "okt", "nov", "dec"]


          def dodaj(tekst: str, foto: str | None = None, izvor: str = "") -> dict | None:
              tekst = (tekst or "").strip()
              link = ""
              m = _URL.search(tekst)
              if m:
                  link = m.group(0).rstrip(").,;")
                  tekst = (tekst[:m.start()] + tekst[m.end():]).strip()
              if not tekst and not link and not foto:
                  return None
              t = now_utc()
              sid = t.astimezone(ZoneInfo("Europe/Belgrade")).strftime("%Y%m%d%H%M") + "-" + hashlib.md5((tekst + link + str(foto)).encode()).hexdigest()[:5]
              it = {"id": sid, "tekst": tekst[:1500], "link": link, "foto": foto or "", "izvor": izvor[:60], "vreme": t.isoformat()}
              DIR.mkdir(parents=True, exist_ok=True)
              (DIR / f"{sid}.json").write_text(json.dumps(it, ensure_ascii=False, indent=1), encoding="utf-8")
              return it


          def ukloni(upit: str) -> dict | None:
              q = fold(upit)
              if not q or not DIR.exists():
                  return None
              for p in sorted(DIR.glob("*.json"), reverse=True):
                  it = json.loads(p.read_text(encoding="utf-8"))
                  if q == fold(it["id"]) or q in fold(it.get("tekst", "")):
                      p.unlink()
                      return it
              return None


          def ucitaj() -> list[dict]:
              if not DIR.exists():
                  return []
              out = []
              tz = ZoneInfo("Europe/Belgrade")
              for p in DIR.glob("*.json"):
                  try:
                      it = json.loads(p.read_text(encoding="utf-8"))
                  except Exception:
                      continue
                  if pravila.blokira(it):
                      continue
                  dt = datetime.fromisoformat(it["vreme"]).astimezone(tz)
                  it["_time"] = f"{dt.day}. {_MES[dt.month - 1]} {dt:%H:%M}"
                  it["_pasusi"] = [x.strip() for x in re.split(r"\n\s*\n|\n", it.get("tekst", "")) if x.strip()]
                  it["_domen"] = urlparse(it["link"]).netloc.removeprefix("www.") if it.get("link") else ""
                  out.append(it)
              out.sort(key=lambda x: x["vreme"], reverse=True)
              return out


          def slike(out: Path, items: list[dict]) -> None:
              from PIL import Image
              (out / "foto" / "a").mkdir(parents=True, exist_ok=True)
              for it in items:
                  n = it.get("foto")
                  src = ROOT / "uploads" / "foto" / n if n else None
                  if not src or not src.exists():
                      it["foto"] = ""
                      continue
                  im = Image.open(src).convert("RGB")
                  im.thumbnail((1100, 1100))
                  im.save(out / "foto" / "a" / n, quality=80, optimize=True, progressive=True)
          F1
          cat > templates/anonimno.html <<'F2'
          {% extends "base.html" %}
          {% block desc %}Nezvanične dojave i informacije koje je redakcija odabrala. Nisu potvrđene.{% endblock %}
          {% block main %}
          <section class="sec-hero an-hero">
            <span class="sec-ring" aria-hidden="true"></span>
            <div><span class="eyebrow">Nezvanično</span><h1>Anonimno</h1><p>Dojave, fotografije i informacije iz nezvaničnih izvora. Redakcija ih bira, ali ih nije potvrdila: mogu biti tačne, a ne moraju. Ako ste pomenuti i želite ispravku ili uklanjanje, pišite na redakcija@prestonica.rs.</p></div>
          </section>
          <div class="an-list">
            {% for it in items %}
            <article class="an-card" id="a-{{ it.id }}">
              <div class="an-meta"><span class="an-badge">Neprovereno</span><time datetime="{{ it.vreme }}">{{ it._time }}</time>{% if it.izvor %}<span class="an-src">{{ it.izvor }}</span>{% endif %}</div>
              {% if it.foto %}<img class="an-img" src="{{ root }}foto/a/{{ it.foto }}" alt="" loading="lazy">{% endif %}
              {% for p in it._pasusi %}<p>{{ p }}</p>{% endfor %}
              {% if it.link %}<a class="an-link" href="{{ it.link }}" target="_blank" rel="noopener nofollow ugc">{{ it._domen }} ↗</a>{% endif %}
            </article>
            {% endfor %}
          </div>
          {% endblock %}
          F2
          grep -q 'an-badge' static/style.css && exit 1
          cat >> static/style.css <<'F3'
          /* rubrika Anonimno: nezvanicne dojave, uvek sa oznakom Neprovereno */
          .an-list{display:grid;gap:16px;max-width:780px;margin:0 auto 56px}
          .an-card{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--ink);border-radius:14px;padding:18px 22px}
          .an-meta{display:flex;align-items:center;flex-wrap:wrap;gap:10px;margin:0 0 12px;font:700 12px var(--sans);color:var(--ink-3)}
          .an-badge{background:var(--ink);color:var(--surface);padding:4px 10px;border-radius:999px;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase}
          .an-src{padding-left:10px;border-left:1px solid var(--line)}
          .an-card p{margin:0 0 10px;font:500 16.5px/1.6 var(--sans);color:var(--ink)}
          .an-img{display:block;width:100%;height:auto;border-radius:10px;margin:0 0 14px}
          .an-link{display:inline-block;margin-top:2px;font:800 13px var(--sans);color:var(--brand);text-decoration:none}
          .an-link:hover{text-decoration:underline}
          F3
          python3 - <<'PY'
          import pathlib
          def zameni(p, parovi):
              f = pathlib.Path(p)
              s = f.read_text(encoding="utf-8")
              for o, n in parovi:
                  assert s.count(o) == 1, (p, o[:60])
                  s = s.replace(o, n)
              f.write_text(s, encoding="utf-8")
          zameni("engine/build.py", [
              ('    base_ctx["has_polls"] = bool(api and polls)\n',
               '    base_ctx["has_polls"] = bool(api and polls)\n'
               '    from . import anonimno\n'
               '    anon = anonimno.ucitaj()\n'
               '    base_ctx["has_anon"] = bool(anon)\n'),
              ('    render("search.html", "pretraga.html", active="pretraga", title="Pretraga", teme=teme)\n',
               '    if anon:\n'
               '        anonimno.slike(out, anon)\n'
               '        render("anonimno.html", "anonimno.html", items=anon[:200], active="anonimno", title="Anonimno", noindex=True)\n'
               '    render("search.html", "pretraga.html", active="pretraga", title="Pretraga", teme=teme)\n'),
          ])
          zameni("engine/telegram.py", [
              ('    "/ankete aktivne ankete\\n"\n',
               '    "/ankete aktivne ankete\\n"\n'
               '    "/anonimno <tekst i link> dodaje dojavu u rubriku Anonimno (može i uz fotografiju)\\n"\n'
               '    "/anonimno_skini <deo teksta> uklanja dojavu\\n"\n'),
              ('            elif cmd == "/status":\n',
               '            elif cmd == "/anonimno":\n'
               '                from . import anonimno\n'
               '                photo = tg.download_photo(m) if m.get("photo") else None\n'
               '                it = anonimno.dodaj(arg, photo)\n'
               '                tg.reply("Dodato u Anonimno, izlazi u sledećem osvežavanju." if it else "Format: /anonimno tekst dojave i link (može i uz fotografiju)")\n'
               '            elif cmd == "/anonimno_skini":\n'
               '                from . import anonimno\n'
               '                it = anonimno.ukloni(arg)\n'
               '                tg.reply("Uklonjeno iz Anonimno: " + (it["tekst"][:80] if it else "") if it else "Nisam našao dojavu: " + arg)\n'
               '            elif cmd == "/status":\n'),
          ])
          zameni("templates/base.html", [
              ("""      {% if has_x %}<a class="nav-a {% if active == 'mreze' %}on{% endif %}" href="{{ root }}mreze.html">Mreže</a>{% endif %}\n""",
               """      {% if has_x %}<a class="nav-a {% if active == 'mreze' %}on{% endif %}" href="{{ root }}mreze.html">Mreže</a>{% endif %}\n"""
               """      {% if has_anon %}<a class="nav-a {% if active == 'anonimno' %}on{% endif %}" href="{{ root }}anonimno.html">Anonimno</a>{% endif %}\n"""),
          ])
          print("ANONIMNO")
          PY
          git rm -q .github/workflows/primeni.yml
          git add -A engine templates static
          git commit -q -m "Rubrika Anonimno: nezvanicne dojave uz oznaku Neprovereno"
          for i in 1 2 3 4 5 6; do
            git pull --rebase -q origin main && git push -q origin HEAD:main && echo "PRIMENJENO" && exit 0
            sleep 10
          done
          exit 1
