name: Primena izmena

on:
  push:
    paths:
      - .github/workflows/primeni.yml

permissions:
  contents: write

jobs:
  primeni:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Usi zaglavlja i polozaj bocnih polja
        run: |
          git config user.name "prestonica-bot"
          git config user.email "bot@users.noreply.github.com"
          python3 - <<'PY'
          import pathlib
          EARS = r'''{% set dp = today.rstrip('.').replace(',', '').split(' ') %}<div class="m-ear m-ear-l" aria-hidden="true"><b>{{ dp[1].rstrip('.') }}</b><span><em>{{ dp[0]|lower }}</em>{{ dp[2] }} {{ dp[3] }}</span></div><div class="m-ear m-ear-r" aria-hidden="true"><span><em><i></i>ažurirano</em>na svakih 15 minuta</span><b>{{ updated }}</b></div>'''
          CSS2 = r'''/* sirok ekran: "usi" zaglavlja kao u stampanim novinama (datum levo, poslednje azuriranje desno) i polja koja nikad ne idu pod zaglavlje */
          .m-ear{display:none}
          @media (min-width:1680px) and (hover:hover) and (pointer:fine){
          .g-side,.g-r{top:200px;transform:translateX(-50%)}
          .m-ear{display:flex;align-items:center;gap:14px;position:absolute;top:22px;height:48px;color:var(--ink);white-space:nowrap}
          .m-ear-l{left:calc((100vw - 1240px) / 4);transform:translateX(-50%)}
          .m-ear-r{right:calc((100vw - 1240px) / 4);transform:translateX(50%)}
          .m-ear b{font:900 46px/1 var(--display,Georgia,serif);letter-spacing:-.02em;font-variant-numeric:lining-nums tabular-nums}
          .m-ear-r b{font-size:34px}
          .m-ear span{display:grid;gap:3px;padding-left:14px;border-left:2px solid var(--line);font:800 10.5px var(--sans);letter-spacing:.18em;text-transform:uppercase;color:var(--ink-3)}
          .m-ear-r span{padding:0 14px 0 0;border:0;border-right:2px solid var(--line);text-align:right}
          .m-ear em{font:italic 600 16px var(--display,Georgia,serif);letter-spacing:0;text-transform:none;color:var(--ink-2);display:inline-flex;align-items:center;gap:6px}
          .m-ear-r em{justify-content:flex-end}
          .m-ear em i{width:7px;height:7px;border-radius:50%;background:var(--ok,#0b8a5b);box-shadow:0 0 0 0 rgba(11,138,91,.5);animation:g-ear 2s infinite}
          @keyframes g-ear{70%{box-shadow:0 0 0 7px rgba(11,138,91,0)}100%{box-shadow:0 0 0 0 rgba(11,138,91,0)}}
          .m-ear::after{content:"";position:absolute;left:0;bottom:-6px;width:28px;height:2px;background:var(--brand);border-radius:2px}
          .m-ear-r::after{left:auto;right:0}
          .g-pulse{-webkit-mask-image:none}
          .g-wv{position:absolute;top:0;bottom:0;left:0;right:96px;overflow:hidden;-webkit-mask-image:linear-gradient(90deg,transparent,#000 14%,#000 86%,transparent);mask-image:linear-gradient(90deg,transparent,#000 14%,#000 86%,transparent)}
          }
          '''
          JS2 = r'''
          /* ---------- sirok ekran: bocna polja uvek ispod zaglavlja, centrirana u vidljivom delu ---------- */
          (function () {
            var g = document.querySelector(".gutters"), m = document.getElementById("mast");
            if (!g || !m || !window.matchMedia) return;
            var mq = window.matchMedia("(min-width: 1680px)"), sides = g.querySelectorAll(".g-side"), q = 0;
            function place() {
              q = 0;
              if (!mq.matches) return;
              var mb = Math.max(0, m.getBoundingClientRect().bottom), vh = window.innerHeight, px = Math.min(24, window.scrollY * 0.02);
              for (var i = 0; i < sides.length; i++) {
                var s = sides[i], h = s.offsetHeight, t = mb + Math.max(18, (vh - mb - h) / 2);
                s.style.top = Math.round(t + (i ? px * 0.5 : px)) + "px";
              }
            }
            function req() { if (!q) { q = 1; requestAnimationFrame(place); } }
            addEventListener("scroll", req, { passive: true });
            addEventListener("resize", req);
            if (mq.addEventListener) mq.addEventListener("change", req);
            place(); setTimeout(place, 700);
          })();
          '''
          EMB = '<a class="m-emb m-emb-l" href="{{ root }}index.html" tabindex="-1" aria-hidden="true"><span>P<i>.</i></span></a><a class="m-emb m-emb-r" href="{{ root }}index.html" tabindex="-1" aria-hidden="true"><span>P<i>.</i></span></a>'
          t = pathlib.Path("templates/base.html")
          s = t.read_text(encoding="utf-8")
          assert s.count(EMB) == 1
          s = s.replace(EMB, EARS)
          o = '<div class="g-pulse"><svg viewBox="0 0 480 44" preserveAspectRatio="none">'
          assert s.count(o) == 1
          s = s.replace(o, '<div class="g-pulse"><span class="g-wv"><svg viewBox="0 0 480 44" preserveAspectRatio="none">')
          o = '</svg><span class="g-on">'
          assert s.count(o) == 1
          s = s.replace(o, '</svg></span><span class="g-on">')
          t.write_text(s, encoding="utf-8")
          c = pathlib.Path("static/style.css")
          s = c.read_text(encoding="utf-8")
          assert ".m-ear" not in s
          c.write_text(s.rstrip("\n") + "\n" + CSS2, encoding="utf-8")
          a = pathlib.Path("static/app.js")
          s = a.read_text(encoding="utf-8")
          p = '    if (gut && wide && wide.matches) gut.style.setProperty("--px", Math.max(-40, Math.min(40, -window.scrollY * 0.03)).toFixed(1) + "px");\n'
          assert s.count(p) == 1
          s = s.replace(p, "")
          a.write_text(s.rstrip("\n") + "\n" + JS2, encoding="utf-8")
          print("USI I POLOZAJ")
          PY
          git rm -q .github/workflows/primeni.yml
          git add -A static templates
          git commit -q -m "Usi zaglavlja (datum, azuriranje) umesto znaka P; bocna polja uvek ispod zaglavlja"
          for i in 1 2 3 4 5 6; do
            git pull --rebase -q origin main && git push -q origin HEAD:main && echo "PRIMENJENO" && exit 0
            sleep 10
          done
          exit 1
