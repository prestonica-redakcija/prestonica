name: Primena izmena

on:
  push:
    paths:
      - .github/workflows/primeni.yml

permissions:
  contents: write

jobs:
  primeni:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Uredjivacka pravila
        run: |
          git config user.name "prestonica-bot"
          git config user.email "bot@users.noreply.github.com"
          cat > engine/pravila.py <<'PYF'
          """Uređivačka pravila redakcije: imena i teme koje portal ne prenosi.

          Spisak se ne drži u repozitorijumu nego u podešavanjima (promenljiva UREDNICKA_PRAVILA,
          jedna stavka po redu ili odvojene zarezom). Bez spiska pravilo ne radi ništa.
          """
          from __future__ import annotations

          import os
          import re

          from .util import fold

          _rx = None


          def _rec(w: str, min_len: int) -> str:
              if len(w) >= min_len:
                  osnova = w[:-1] if w[-1] in "aeiou" else w
                  return re.escape(osnova) + "[a-z]{0,3}"
              return re.escape(w)


          def _ucitaj():
              global _rx
              if _rx is None:
                  delovi = []
                  for red in re.split(r"[\n;,]+", os.environ.get("UREDNICKA_PRAVILA", "")):
                      reci = fold(red).split()
                      if reci:
                          m = 3 if len(reci) > 1 else 4
                          delovi.append(" ".join(_rec(w, m) for w in reci))
                  _rx = re.compile("(?<![a-z0-9])(?:" + "|".join(delovi) + ")(?![a-z0-9])") if delovi else False
              return _rx


          def _tekst(x, d: int = 0) -> str:
              if d > 4:
                  return ""
              if isinstance(x, str):
                  return x
              if isinstance(x, dict):
                  return " ".join(_tekst(v, d + 1) for k, v in x.items() if not str(k).startswith("_"))
              if isinstance(x, (list, tuple)):
                  return " ".join(_tekst(v, d + 1) for v in x)
              return ""


          def blokira(*x) -> bool:
              """Da li tekst, vest, snimak, objava ili anketa sadrži nešto sa spiska."""
              rx = _ucitaj()
              if not rx:
                  return False
              return bool(rx.search(fold(" ".join(_tekst(v) for v in x))))
          PYF
          python3 - <<'PY'
          import pathlib
          def zameni(p, parovi):
              f = pathlib.Path(p)
              s = f.read_text(encoding="utf-8")
              for o, n in parovi:
                  assert s.count(o) == 1, (p, o[:60])
                  s = s.replace(o, n)
              f.write_text(s, encoding="utf-8")
          zameni("engine/build.py", [
              ("from . import rank, widgets\n", "from . import pravila, rank, widgets\n"),
              ('        a["_minutes"] = max(1, round(sum(len(p.split()) for p in [a["lead"]] + a["body"]) / 200))\n',
               '        a["_minutes"] = max(1, round(sum(len(p.split()) for p in [a["lead"]] + a["body"]) / 200))\n'
               '    tiho = [a for a in visible if pravila.blokira(a)]\n'
               '    if tiho:\n'
               '        _t = {id(a) for a in tiho}\n'
               '        visible = [a for a in visible if id(a) not in _t]\n'),
              ("    people, match_people = _person_matcher(list(cfg.licnosti) + _auto)\n",
               "    people, match_people = _person_matcher([p for p in list(cfg.licnosti) + _auto if not pravila.blokira(p)])\n"),
              ('    videos = [dict(v) for v in (state.get("videos") or []) if not v.get("skip") and v.get("live") != "upcoming"]\n',
               '    videos = [dict(v) for v in (state.get("videos") or []) if not v.get("skip") and v.get("live") != "upcoming" and not pravila.blokira(v)]\n'),
              ('if p.get("prikazi") and p["x"].lower() not in _xskip]\n',
               'if p.get("prikazi") and p["x"].lower() not in _xskip and not pravila.blokira(p)]\n'),
              ('    polls = sorted((dict(p) for p in state.get("ankete", [])), key=lambda p: p["start"], reverse=True)\n',
               '    polls = sorted((dict(p) for p in state.get("ankete", []) if not pravila.blokira(p)), key=lambda p: p["start"], reverse=True)\n'),
              ("        drustvene.build_cards(cfg, visible, out)\n", "        drustvene.build_cards(cfg, visible + tiho, out)\n"),
              ('        render("article.html", a["_url"], a=a, related=rel, active=a["section"], title=a["headline"], vid=a.get("_video"))\n',
               '        render("article.html", a["_url"], a=a, related=rel, active=a["section"], title=a["headline"], vid=a.get("_video"))\n'
               '    for a in tiho:\n'
               '        a["_people"], a["_x"], a["_video"] = [], [], None\n'
               '        render("article.html", a["_url"], a=a, related=[], active=a["section"], title=a["headline"], vid=None, noindex=True)\n'),
              ("    _copy_photos(root, out, visible)\n", "    _copy_photos(root, out, visible + tiho)\n"),
          ])
          zameni("engine/run.py", [
              ("from . import build, cluster, config, fetch, rank, store\n", "from . import build, cluster, config, fetch, pravila, rank, store\n"),
              ('        fresh = [it for it in items if it["link"] not in seen]\n',
               '        fresh = [it for it in items if it["link"] not in seen and not pravila.blokira(it)]\n'),
              ('            a = make_article(out, "vest", cfg, articles, srcs, pub)\n',
               '            a = make_article(out, "vest", cfg, articles, srcs, pub)\n'
               '            if pravila.blokira(a):\n'
               '                continue\n'),
              ('                if not out or out.get("preskoci") or not out.get("pasusi"):\n',
               '                if not out or out.get("preskoci") or not out.get("pasusi") or pravila.blokira(out):\n'),
              ('                    arts = [a for a in articles if a["kind"] == "vest" and not a.get("hidden") and age_hours(a["published"]) < 48]\n',
               '                    arts = [a for a in articles if a["kind"] == "vest" and not a.get("hidden") and age_hours(a["published"]) < 48 and not pravila.blokira(a)]\n'),
              ("                objave_x.run(cfg, state, articles, t0)\n", "                objave_x.run(cfg, state, [a for a in articles if not pravila.blokira(a)], t0)\n"),
              ("            ankete.run(cfg, state, articles, writer, live)\n", "            ankete.run(cfg, state, [a for a in articles if not pravila.blokira(a)], writer, live)\n"),
              ("            licnosti.run(cfg, state, articles, writer, live)\n", "            licnosti.run(cfg, state, [a for a in articles if not pravila.blokira(a)], writer, live)\n"),
          ])
          zameni("templates/base.html", [
              ('<meta name="description" content="{% block desc %}{{ portal.opis }}{% endblock %}">\n',
               '<meta name="description" content="{% block desc %}{{ portal.opis }}{% endblock %}">\n{% if noindex %}<meta name="robots" content="noindex">{% endif %}\n'),
          ])
          print("PRAVILA")
          PY
          git rm -q .github/workflows/primeni.yml
          git add -A engine templates
          git commit -q -m "Uredjivacka pravila redakcije (spisak u podesavanjima)"
          for i in 1 2 3 4 5 6; do
            git pull --rebase -q origin main && git push -q origin HEAD:main && echo "PRIMENJENO" && exit 0
            sleep 10
          done
          exit 1
